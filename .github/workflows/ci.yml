name: convert and prove

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fidelity:
    name: conversion + fidelity harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: unit tests
        run: node --test test/

      - name: convert the coded page
        run: node src/cli.mjs convert --in demo/coded/index.html --out out --media-base "https://cleancutautoshield.com/wp-content/uploads/cte" --title "CleanCut Auto Shield — Home"

      - name: the conversion is deterministic
        run: |
          cp out/template.json /tmp/first.json
          node src/cli.mjs convert --in demo/coded/index.html --out out --media-base "https://cleancutautoshield.com/wp-content/uploads/cte" --title "CleanCut Auto Shield — Home" >/dev/null
          diff -q /tmp/first.json out/template.json && echo "same page in, byte-identical JSON out"

      - name: editability audit
        run: node harness/editability.mjs out/template.json out/model.json

      - name: fidelity harness (real WordPress + Elementor, imported and rendered)
        run: node harness/run.mjs

      - name: fidelity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-report
          path: |
            report/
            out/
          retention-days: 90
